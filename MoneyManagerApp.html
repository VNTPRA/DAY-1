<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Manager</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #21253a;
      --border:      #2e3350;
      --accent:      #6c8ef5;
      --accent-soft: rgba(108,142,245,.12);
      --green:       #34d399;
      --green-soft:  rgba(52,211,153,.12);
      --red:         #f87171;
      --red-soft:    rgba(248,113,113,.12);
      --text:        #e8eaf6;
      --muted:       #7b82a8;
      --card-shadow: 0 4px 24px rgba(0,0,0,.45);
      --radius:      14px;
      --font:        'Georgia', 'Times New Roman', serif;
      --font-mono:   'Courier New', Courier, monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* subtle mesh gradient on body */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 10%,  rgba(108,142,245,.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%,  rgba(52,211,153,.05)  0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(248,113,113,.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout Wrapper ────────────────────────────────────── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ─── Header ────────────────────────────────────────────── */
    header {
      padding: 36px 0 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }

    header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    header .logo svg { width: 32px; height: 32px; }

    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b8ff 0%, #6c8ef5 40%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: .92rem;
      color: var(--muted);
      margin-top: 4px;
      font-style: italic;
    }

    /* ─── Summary Cards ─────────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    @media (max-width: 620px) {
      .cards { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--card-shadow);
      transition: transform .2s;
    }
    .card:hover { transform: translateY(-2px); }

    .card .label {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card .amount {
      font-family: var(--font-mono);
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700;
    }

    .card.balance  .amount { color: var(--accent); }
    .card.income   .amount { color: var(--green);  }
    .card.expenses .amount { color: var(--red);    }

    .card .bar {
      height: 3px;
      border-radius: 2px;
      margin-top: 14px;
      opacity: .5;
    }
    .card.balance  .bar { background: var(--accent); }
    .card.income   .bar { background: var(--green);  }
    .card.expenses .bar { background: var(--red);    }

    /* ─── Grid: Form + List ─────────────────────────────────── */
    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 760px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* ─── Panel (shared card shell) ─────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--muted);
      background: var(--surface2);
    }

    /* ─── Add Transaction Form ──────────────────────────────── */
    .form-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field label {
      display: block;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .field select option { background: #1a1d27; }

    /* type toggle */
    .type-toggle {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .type-toggle button {
      flex: 1;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: .88rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .type-toggle button.active-income {
      background: var(--green-soft);
      color: var(--green);
    }
    .type-toggle button.active-expense {
      background: var(--red-soft);
      color: var(--red);
    }

    /* error message */
    .error-msg {
      background: var(--red-soft);
      border: 1px solid rgba(248,113,113,.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--red);
      font-size: .85rem;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* form buttons */
    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font);
      font-size: .92rem;
      font-weight: 600;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: linear-gradient(135deg, #6c8ef5, #4f6fe0);
      color: #fff;
      box-shadow: 0 4px 14px rgba(108,142,245,.3);
    }
    .btn-primary:hover { opacity: .9; }

    .btn-ghost {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); }

    /* ─── Transactions Panel ────────────────────────────────── */
    .list-controls {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-wrap: wrap;
    }

    .list-controls input,
    .list-controls select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 11px;
      color: var(--text);
      font-family: var(--font);
      font-size: .85rem;
      outline: none;
      transition: border-color .2s;
    }
    .list-controls input { flex: 1; min-width: 120px; }
    .list-controls select { min-width: 120px; }
    .list-controls input:focus,
    .list-controls select:focus { border-color: var(--accent); }
    .list-controls select option { background: #1a1d27; }

    /* transaction table */
    .tx-table-wrap {
      overflow-x: auto;
      max-height: 540px;
      overflow-y: auto;
    }

    /* custom scrollbar */
    .tx-table-wrap::-webkit-scrollbar { width: 5px; height: 5px; }
    .tx-table-wrap::-webkit-scrollbar-track { background: transparent; }
    .tx-table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }

    thead th {
      padding: 11px 16px;
      text-align: left;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      background: var(--surface2);
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }

    tbody tr {
      border-top: 1px solid var(--border);
      transition: background .15s;
    }
    tbody tr:hover { background: rgba(255,255,255,.025); }

    td {
      padding: 12px 16px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .tx-desc {
      white-space: normal;
      max-width: 180px;
      font-size: .9rem;
      font-weight: 500;
    }

    .cat-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .8px;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .amount-cell {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: .92rem;
    }
    .amount-cell.income  { color: var(--green); }
    .amount-cell.expense { color: var(--red);   }

    .date-cell { color: var(--muted); font-size: .78rem; font-family: var(--font-mono); }

    .btn-delete {
      background: none;
      border: 1px solid rgba(248,113,113,.25);
      border-radius: 6px;
      color: var(--red);
      padding: 4px 10px;
      cursor: pointer;
      font-size: .78rem;
      opacity: .7;
      transition: opacity .2s, background .2s;
    }
    .btn-delete:hover { opacity: 1; background: var(--red-soft); }

    /* empty state */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-style: italic;
      font-size: .92rem;
    }

    .empty-state svg { opacity: .3; margin-bottom: 12px; }

    /* ─── Misc ──────────────────────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
    }

    /* slide-in for new rows */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .new-row { animation: slideIn .3s ease forwards; }

    /* pulse on summary cards update */
    @keyframes pulse {
      0%   { opacity: 1; }
      50%  { opacity: .5; }
      100% { opacity: 1; }
    }
    .updating { animation: pulse .35s ease; }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <!-- coin SVG icon -->
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="16" cy="16" r="15" stroke="url(#hg)" stroke-width="2"/>
        <text x="16" y="21" text-anchor="middle" font-size="14" font-family="Georgia,serif"
              font-weight="700" fill="url(#hg)">$</text>
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#a5b8ff"/>
            <stop offset="60%" stop-color="#6c8ef5"/>
            <stop offset="100%" stop-color="#34d399"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>Money Manager</h1>
    </div>
    <p>Track your income &amp; expenses, stay in control.</p>
  </header>

  <!-- ── Summary Cards ──────────────────────────────────────── -->
  <section class="cards" aria-label="Financial summary">
    <div class="card balance">
      <div class="label">Total Balance</div>
      <div class="amount" id="card-balance">$0.00</div>
      <div class="bar"></div>
    </div>
    <div class="card income">
      <div class="label">Total Income</div>
      <div class="amount" id="card-income">$0.00</div>
      <div class="bar"></div>
    </div>
    <div class="card expenses">
      <div class="label">Total Expenses</div>
      <div class="amount" id="card-expenses">$0.00</div>
      <div class="bar"></div>
    </div>
  </section>

  <!-- ── Main Grid ───────────────────────────────────────────── -->
  <div class="main-grid">

    <!-- ── Add Transaction Form ────────────────────────────── -->
    <aside>
      <div class="panel">
        <div class="panel-header">Add Transaction</div>
        <div class="form-body">

          <!-- Type toggle -->
          <div class="field">
            <label>Type</label>
            <div class="type-toggle" role="group" aria-label="Transaction type">
              <button type="button" id="btn-income"  class="active-income" aria-pressed="true">
                + Income
              </button>
              <button type="button" id="btn-expense" aria-pressed="false">
                - Expense
              </button>
            </div>
          </div>

          <!-- Description -->
          <div class="field">
            <label for="inp-desc">Description</label>
            <input
              id="inp-desc"
              type="text"
              maxlength="80"
              placeholder="e.g. Freelance payment"
              autocomplete="off"
            />
          </div>

          <!-- Amount -->
          <div class="field">
            <label for="inp-amount">Amount (USD)</label>
            <input
              id="inp-amount"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="0.00"
            />
          </div>

          <!-- Category -->
          <div class="field">
            <label for="inp-cat">Category</label>
            <select id="inp-cat">
              <option value="Other">Other</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Rent">Rent</option>
              <option value="Salary">Salary</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Utilities">Utilities</option>
            </select>
          </div>

          <!-- Error message -->
          <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>

          <!-- Buttons -->
          <div class="btn-row">
            <button class="btn btn-primary" id="btn-submit" type="button">Add</button>
            <button class="btn btn-ghost"   id="btn-clear"  type="button">Clear</button>
          </div>

        </div>
      </div>
    </aside>

    <!-- ── Transaction List ─────────────────────────────────── -->
    <main>
      <div class="panel">
        <div class="panel-header">Transactions</div>

        <!-- Filters -->
        <div class="list-controls">
          <input
            type="search"
            id="filter-search"
            placeholder="Search description..."
            aria-label="Search transactions"
          />
          <select id="filter-cat" aria-label="Filter by category">
            <option value="">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Salary">Salary</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <select id="filter-type" aria-label="Filter by type">
            <option value="">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <!-- Table -->
        <div class="tx-table-wrap" id="tx-wrap">
          <table aria-label="Transaction history">
            <thead>
              <tr>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Date &amp; Time</th>
                <th><span class="sr-only">Delete</span></th>
              </tr>
            </thead>
            <tbody id="tx-body"></tbody>
          </table>
          <div class="empty-state" id="empty-state">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <rect x="4" y="10" width="32" height="24" rx="4" stroke="#7b82a8" stroke-width="2"/>
              <path d="M4 16h32" stroke="#7b82a8" stroke-width="2"/>
              <rect x="10" y="22" width="8" height="4" rx="1" fill="#7b82a8"/>
            </svg>
            <p>No transactions yet. Add one to get started!</p>
          </div>
        </div>

      </div>
    </main>

  </div><!-- /main-grid -->

</div><!-- /wrapper -->

<script>
  /* ═══════════════════════════════════════════════════════════
     Money Manager — all logic
  ═══════════════════════════════════════════════════════════ */

  /* ── Storage helpers ──────────────────────────────────────── */
  const STORAGE_KEY = 'mm_transactions_v1';

  /** Load transactions array from localStorage (or return []) */
  function loadTransactions() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (_) {
      return [];
    }
  }

  /** Persist transactions array to localStorage */
  function saveTransactions(txs) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(txs));
  }

  /* ── App state ────────────────────────────────────────────── */
  let transactions = loadTransactions();   // master list
  let selectedType = 'income';             // current form type toggle

  /* ── Currency formatter ──────────────────────────────────── */
  const fmt = new Intl.NumberFormat('en-US', {
    style: 'currency', currency: 'USD', minimumFractionDigits: 2
  });

  /* ── DOM refs ────────────────────────────────────────────── */
  const cardBalance  = document.getElementById('card-balance');
  const cardIncome   = document.getElementById('card-income');
  const cardExpenses = document.getElementById('card-expenses');

  const btnIncome    = document.getElementById('btn-income');
  const btnExpense   = document.getElementById('btn-expense');
  const inpDesc      = document.getElementById('inp-desc');
  const inpAmount    = document.getElementById('inp-amount');
  const inpCat       = document.getElementById('inp-cat');
  const errorMsg     = document.getElementById('error-msg');
  const btnSubmit    = document.getElementById('btn-submit');
  const btnClear     = document.getElementById('btn-clear');

  const txBody       = document.getElementById('tx-body');
  const emptyState   = document.getElementById('empty-state');
  const filterSearch = document.getElementById('filter-search');
  const filterCat    = document.getElementById('filter-cat');
  const filterType   = document.getElementById('filter-type');

  /* ── Type toggle ─────────────────────────────────────────── */
  btnIncome.addEventListener('click', () => setType('income'));
  btnExpense.addEventListener('click', () => setType('expense'));

  function setType(type) {
    selectedType = type;
    btnIncome.className  = type === 'income'  ? 'active-income'  : '';
    btnExpense.className = type === 'expense' ? 'active-expense' : '';
    btnIncome.setAttribute('aria-pressed',  type === 'income');
    btnExpense.setAttribute('aria-pressed', type === 'expense');
  }

  /* ── Error display ──────────────────────────────────────── */
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }
  function clearError() {
    errorMsg.textContent = '';
    errorMsg.classList.remove('visible');
  }

  /* ── Clear form ──────────────────────────────────────────── */
  function clearForm() {
    inpDesc.value   = '';
    inpAmount.value = '';
    inpCat.value    = 'Other';
    clearError();
  }
  btnClear.addEventListener('click', clearForm);

  /* ── Add transaction ─────────────────────────────────────── */
  btnSubmit.addEventListener('click', () => {
    clearError();

    const desc   = inpDesc.value.trim();
    const rawAmt = inpAmount.value.trim();
    const cat    = inpCat.value;
    const amount = parseFloat(rawAmt);

    /* Validation */
    if (!desc) {
      showError('Please enter a description for this transaction.');
      inpDesc.focus();
      return;
    }
    if (!rawAmt || isNaN(amount)) {
      showError('Please enter a valid numeric amount.');
      inpAmount.focus();
      return;
    }
    if (amount <= 0) {
      showError('Amount must be greater than $0.00.');
      inpAmount.focus();
      return;
    }

    /* Build transaction object */
    const tx = {
      id:       crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
      desc,
      amount:   parseFloat(amount.toFixed(2)),
      type:     selectedType,
      category: cat,
      date:     new Date().toISOString()
    };

    /* Prepend (newest first) */
    transactions.unshift(tx);
    saveTransactions(transactions);

    /* Update UI */
    updateSummary();
    renderList();
    clearForm();
  });

  /* Also allow Enter key on inputs to submit */
  [inpDesc, inpAmount].forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') btnSubmit.click();
    });
  });

  /* ── Summary cards ───────────────────────────────────────── */
  function updateSummary() {
    let income = 0, expenses = 0;

    transactions.forEach(tx => {
      if (tx.type === 'income')  income   += tx.amount;
      else                       expenses += tx.amount;
    });

    const balance = income - expenses;

    /* Pulse animation helper */
    const pulse = el => {
      el.classList.remove('updating');
      void el.offsetWidth; // reflow
      el.classList.add('updating');
    };

    pulse(cardBalance);
    pulse(cardIncome);
    pulse(cardExpenses);

    cardBalance.textContent  = fmt.format(balance);
    cardIncome.textContent   = fmt.format(income);
    cardExpenses.textContent = fmt.format(expenses);

    /* Colour balance card based on positive / negative */
    const balCard = cardBalance.closest('.card');
    if (balance < 0) {
      cardBalance.style.color = 'var(--red)';
    } else {
      cardBalance.style.color = '';
    }
  }

  /* ── Date formatter ──────────────────────────────────────── */
  function formatDate(iso) {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    return `${date} ${time}`;
  }

  /* ── Render transaction list ──────────────────────────────── */
  function renderList() {
    const search   = filterSearch.value.trim().toLowerCase();
    const catVal   = filterCat.value;
    const typeVal  = filterType.value;

    /* Apply filters */
    const visible = transactions.filter(tx => {
      const matchSearch = !search      || tx.desc.toLowerCase().includes(search);
      const matchCat    = !catVal      || tx.category === catVal;
      const matchType   = !typeVal     || tx.type === typeVal;
      return matchSearch && matchCat && matchType;
    });

    /* Show/hide empty state */
    emptyState.style.display = visible.length === 0 ? 'block' : 'none';

    /* Build rows */
    txBody.innerHTML = visible.map((tx, i) => {
      const sign    = tx.type === 'income' ? '+' : '-';
      const cls     = tx.type === 'income' ? 'income' : 'expense';
      const isNew   = i === 0 && tx === transactions[0]; // first render of newest
      return `
        <tr class="${isNew ? 'new-row' : ''}" data-id="${tx.id}">
          <td class="tx-desc">${escHtml(tx.desc)}</td>
          <td><span class="cat-badge">${escHtml(tx.category)}</span></td>
          <td class="amount-cell ${cls}">${sign}${fmt.format(tx.amount)}</td>
          <td class="date-cell">${formatDate(tx.date)}</td>
          <td>
            <button
              class="btn-delete"
              data-id="${tx.id}"
              aria-label="Delete transaction: ${escHtml(tx.desc)}"
            >Delete</button>
          </td>
        </tr>
      `;
    }).join('');

    /* Delegate delete clicks */
    txBody.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', () => deleteTransaction(btn.dataset.id));
    });
  }

  /* ── Delete transaction ──────────────────────────────────── */
  function deleteTransaction(id) {
    transactions = transactions.filter(tx => tx.id !== id);
    saveTransactions(transactions);
    updateSummary();
    renderList();
  }

  /* ── Filter listeners ─────────────────────────────────────── */
  filterSearch.addEventListener('input',  renderList);
  filterCat.addEventListener('change',    renderList);
  filterType.addEventListener('change',   renderList);

  /* ── HTML escaping utility ───────────────────────────────── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── Init ─────────────────────────────────────────────────── */
  updateSummary();
  renderList();

</script>
</body>
</html>
